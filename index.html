<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171713">
<title>C-vua-GM | Chess Arena</title>
<style>
:root{color-scheme:dark;--bg:#171713;--panel:#25241f;--line:#45443d;--green:#86bd4e;--light:#eee3ca;--dark:#78945b;--text:#f3f0e8;--muted:#b9b4a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,Arial,sans-serif;padding:14px}
main{max-width:760px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:23px;margin:0}small,.muted{color:var(--muted)}#engine{font-weight:700;color:#f3c86a;font-size:14px;text-align:right}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
button,select{background:#302f29;color:var(--text);border:1px solid #55534b;border-radius:11px;padding:12px;font:inherit;min-width:0}
button:active{transform:scale(.98)}button.primary{background:var(--green);color:#18210f;font-weight:800;border-color:var(--green)}
button:disabled{opacity:.4}select{width:100%}.field{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.boardwrap{max-width:560px;margin:14px auto}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:3px solid #4a4942;border-radius:8px;overflow:hidden;touch-action:manipulation}
.square{border:0;border-radius:0;padding:0;aspect-ratio:1;display:grid;place-items:center;position:relative;font-family:"Segoe UI Symbol","Noto Sans Symbols 2",serif;font-size:clamp(27px,8vw,56px);line-height:1}
.square.light{background:var(--light);color:#171717}.square.dark{background:var(--dark);color:#171717}
.square.selected{box-shadow:inset 0 0 0 4px #eacb45}.square.last{background:#c7c65c}
.square .coord{position:absolute;font:10px system-ui;left:4px;top:2px;opacity:.7}
.square .dot{position:absolute;width:22%;height:22%;border-radius:50%;background:#24351c77}
.piece.white{color:#fffdf4;text-shadow:0 1px 2px #111,1px 1px 2px #111,-1px -1px 2px #111}
.piece.black{color:#191919;text-shadow:0 1px 1px #fff8}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.clock{background:#171713;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}.clock.active{border-color:var(--green);color:#b7e77f}
.status{padding:10px;border-radius:10px;background:#1c1b17;color:#d8d2c5;margin-top:10px;min-height:42px}
.moves{max-height:150px;overflow:auto;white-space:pre-wrap;font:13px ui-monospace,monospace;color:#ddd}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
@media(max-width:430px){body{padding:8px}.panel{padding:12px}h1{font-size:20px}.controls{gap:7px}.square{font-size:clamp(25px,9vw,43px)}}
</style>
</head>
<body>
<main>
<section class="panel">
<header><div><h1>♛ C-vua-GM</h1><small>Chess Arena · Standard</small></div><div id="engine">Đang kiểm tra AI…</div></header>
<div class="controls">
<label class="field">Mức Stockfish<select id="level"><option value="1">Cấp 1</option><option value="3">Cấp 3</option><option value="5">Cấp 5</option><option value="8">Cấp 8</option><option value="10" selected>Cấp 10</option><option value="12">Cấp 12</option><option value="15">Cấp 15</option><option value="18">Cấp 18</option></select></label>
<label class="field">Phe của bạn<select id="color"><option value="w">Trắng (đi trước)</option><option value="b">Đen</option></select></label>
<label class="field">Thời gian<select id="time"><option value="300">5+0</option><option value="600" selected>10+0</option><option value="900">15+0</option><option value="180">3+2</option></select></label>
<label class="field">Phong cách AI<select id="style"><option value="balanced">Cân bằng</option><option value="aggressive">Tấn công</option><option value="solid">Chắc chắn</option><option value="random">Khó đoán</option></select></label>
</div>
<div class="boardwrap"><div class="clocks"><div><small>🤖 Stockfish</small><div class="clock" id="blackClock">10:00</div></div><div><small>♙ Bạn</small><div class="clock" id="whiteClock">10:00</div></div></div>
<div id="board" class="board" aria-label="Bàn cờ vua"></div>
<div class="clocks"><div class="muted" id="blackName">Đen</div><div class="muted" id="whiteName">Trắng</div></div></div>
<div class="status" id="status">Đang tải luật cờ và engine. Nếu AI lỗi, trang sẽ báo nguyên nhân.</div>
<div class="row" style="margin-top:10px"><button class="primary" id="new">Ván mới</button><button id="undo">Đi lại</button><button id="flip">Xoay bàn</button><button id="resign">Đầu hàng</button></div>
</section>
<section class="panel"><b>Biên bản ván đấu</b><div id="moves" class="moves" style="margin-top:8px">Chưa có nước đi.</div><div class="row" style="margin-top:10px"><button id="copy">Sao chép PGN</button><button id="analyze">Đánh giá vị trí</button></div><div id="analysis" class="status">Chưa có phân tích.</div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const glyph={p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚'};
let game=null,worker=null,engineReady=false,engineBusy=false,flipped=false,selected=null,legal=[],lastMove=null;
let remaining={w:600,b:600},increment=0,tick=null,clockSide='w',gameOver=false,aiColor='b',engineLines=[],pendingResolve=null;
const files='abcdefgh',pieceColor=p=>p===p.toUpperCase()?'w':'b';
function setStatus(t){$('status').textContent=t}
function fmt(n){n=Math.max(0,Math.ceil(n));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function updateClocks(){ $('whiteClock').textContent=fmt(remaining.w);$('blackClock').textContent=fmt(remaining.b);$('whiteClock').classList.toggle('active',clockSide==='w'&&!gameOver);$('blackClock').classList.toggle('active',clockSide==='b'&&!gameOver)}
function stopClock(){if(tick){clearInterval(tick);tick=null}}
function startClock(){stopClock();clockSide=game.turn();let prev=Date.now();tick=setInterval(()=>{if(gameOver||game.game_over())return stopClock();let now=Date.now();remaining[clockSide]-=(now-prev)/1000;prev=now;if(remaining[clockSide]<=0){remaining[clockSide]=0;gameOver=true;stopClock();setStatus((clockSide==='w'?'Trắng':'Đen')+' hết giờ.');}updateClocks()},200);updateClocks()}
function render(){
 const b=$('board');b.innerHTML='';const board=game.board();
 for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){
  const r=flipped?7-vr:vr,c=flipped?7-vc:vc,sq=files[c]+(8-r),p=board[r][c],el=document.createElement('button');
  el.className='square '+((r+c)%2?'dark':'light');el.dataset.square=sq;
  if(selected===sq)el.classList.add('selected');
  if(lastMove&&(lastMove.from===sq||lastMove.to===sq))el.classList.add('last');
  if(vr===7)el.insertAdjacentHTML('beforeend','<span class="coord">'+files[c]+'</span>');
  if(vc===0)el.insertAdjacentHTML('beforeend','<span class="coord" style="left:auto;right:4px">'+(8-r)+'</span>');
  if(p){const span=document.createElement('span');span.className='piece '+(p.color==='w'?'white':'black');span.textContent=glyph[p.type];el.appendChild(span)}
  if(legal.some(m=>m.to===sq)){const dot=document.createElement('i');dot.className='dot';el.appendChild(dot)}
  el.addEventListener('click',()=>clickSquare(sq));b.appendChild(el);
 }
 $('moves').textContent=game.history().length?game.history().map((m,i)=>(i%2?Math.ceil((i+1)/2)+'. ':'')+m).join('  '):'Chưa có nước đi.';
 $('blackName').textContent=aiColor==='b'?'🤖 Stockfish':'Đen';$('whiteName').textContent=aiColor==='w'?'🤖 Stockfish':'Bạn';
 updateClocks();
}
function clickSquare(sq){
 if(gameOver||game.game_over()||game.turn()===aiColor)return;
 const piece=game.get(sq);
 if(selected&&legal.some(m=>m.to===sq)){
  const move=game.move({from:selected,to:sq,promotion:'q'});selected=null;legal=[];afterMove(move);return;
 }
 if(piece&&piece.color===game.turn()){selected=sq;legal=game.moves({square:sq,verbose:true});}
 else{selected=null;legal=[]}
 render();
}
function afterMove(move){
 lastMove=move;remaining[move.color]+=increment;selected=null;legal=[];render();
 if(game.game_over()){gameOver=true;stopClock();setStatus(game.in_checkmate()?'Chiếu hết! '+(game.turn()==='w'?'Đen':'Trắng')+' thắng.': 'Ván đấu kết thúc: '+(game.in_draw()?'Hòa.':'Kết thúc.'));return}
 setStatus(game.in_check()?'Chiếu!':'Đến lượt '+(game.turn()==='w'?'Trắng':'Đen')+'.');
 startClock();
 if(game.turn()===aiColor)askEngine();
}
function engineStatus(t,ok=false){$('engine').textContent=t;$('engine').style.color=ok?'#a8dc70':'#f3c86a'}
function initEngine(){
 engineStatus('Đang tải Stockfish…');
 try{
  // Stockfish 10 is intentionally used as a legacy, single-thread browser build.
  const workerCode=`importScripts('https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js');`;
  const blob=new Blob([workerCode],{type:'application/javascript'});
  worker=new Worker(URL.createObjectURL(blob));
  let readyTimer=setTimeout(()=>{if(!engineReady){engineStatus('AI tải quá lâu');setStatus('Stockfish chưa phản hồi sau 15 giây. Kiểm tra mạng hoặc đường dẫn engine.');}},15000);
  worker.onmessage=e=>{
   const msg=String(e.data||'');
   if(msg==='uciok'){worker.postMessage('isready');return}
   if(msg==='readyok'){engineReady=true;clearTimeout(readyTimer);engineStatus('AI đã sẵn sàng',true);setStatus('Stockfish đã sẵn sàng. Chọn nước đi để bắt đầu!');if(game&&game.turn()===aiColor)askEngine();return}
   if(msg.startsWith('info ')){const m=msg.match(/score (cp|mate) (-?\\d+)/);if(m)engineLines=[m[1]==='cp'?(Number(m[2])/100).toFixed(2):'Mate '+m[2]];return}
   if(msg.startsWith('bestmove ')){
    engineBusy=false;if(pendingResolve){pendingResolve(msg.split(/\\s+/)[1]);pendingResolve=null}
   }
  };
  worker.onerror=()=>{engineStatus('Lỗi tải AI');setStatus('Không tải được Stockfish. Có thể CDN bị chặn hoặc không có mạng.');};
  worker.postMessage('uci');
 }catch(e){engineStatus('Không khởi động được AI');setStatus('Lỗi tạo Worker: '+e.message)}
}
function getBestMove(){
 return new Promise(resolve=>{
  if(!engineReady||!worker){resolve(null);return}
  if(engineBusy){resolve(null);return}
  engineBusy=true;pendingResolve=resolve;
  const depth=Math.max(4,Math.min(18,Number($('level').value)));
  const fen=game.fen();
  worker.postMessage('ucinewgame');worker.postMessage('position fen '+fen);
  worker.postMessage('go depth '+depth);
  setTimeout(()=>{if(pendingResolve===resolve){pendingResolve=null;engineBusy=false;resolve(null)}},25000);
 });
}
async function askEngine(){
 if(gameOver||game.game_over()||game.turn()!==aiColor)return;
 if(!engineReady){setStatus('AI chưa sẵn sàng. Chờ trạng thái AI đã sẵn sàng.');return}
 setStatus('Stockfish đang suy nghĩ…');
 const uci=await getBestMove();
 if(!uci||uci==='(none)'){setStatus('AI không trả về nước đi.');return}
 const from=uci.slice(0,2),to=uci.slice(2,4),promotion=uci[4]||'q';
 const move=game.move({from,to,promotion});
 if(move)afterMove(move);else setStatus('Engine trả về nước không hợp lệ: '+uci);
}
function newGame(){
 if(!window.Chess){setStatus('Không tải được thư viện luật cờ. Kiểm tra kết nối Internet.');return}
 stopClock();game=new Chess();aiColor=$('color').value;remaining={w:Number($('time').value),b:Number($('time').value)};increment=$('time').value==='180'?2:0;gameOver=false;selected=null;legal=[];lastMove=null;engineLines=[];render();setStatus('Ván mới. '+(aiColor==='w'?'AI đi trước.':'Bạn đi trước.'));
 startClock();if(aiColor==='w')askEngine();
}
$('new').onclick=newGame;
$('undo').onclick=()=>{if(!game||!game.history().length)return;stopClock();game.undo();if(game.history().length&&game.turn()===aiColor)game.undo();gameOver=false;lastMove=null;selected=null;legal=[];render();setStatus('Đã đi lại.');startClock()};
$('flip').onclick=()=>{flipped=!flipped;render()};
$('resign').onclick=()=>{if(!game||gameOver)return;gameOver=true;stopClock();setStatus('Bạn đã đầu hàng.');};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(game?game.pgn():'');setStatus('Đã sao chép PGN.')}catch(e){setStatus('Trình duyệt không cho phép sao chép tự động.')}};
$('analyze').onclick=()=>{$('analysis').textContent=engineLines.length?'Đánh giá gần nhất: '+engineLines[0]+' (thông tin từ lần tìm kiếm AI).':'Chưa có dữ liệu đánh giá. Chơi vài nước trước.'};
$('color').onchange=()=>newGame();
window.addEventListener('beforeunload',stopClock);
if(window.Chess){newGame();initEngine()}else{engineStatus('Đang tải luật cờ…');setStatus('Đang tải chess.js…');}
})();
</script>
</body>
</html>
