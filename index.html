<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PULSE & REFLEX HUB</title>
<style>
:root{
  --bg:#0b0f17;--card:#131a26;--card2:#1a2434;--line:#29364d;
  --txt:#f1f5f9;--mut:#94a3b8;--acc:#10b981;--warn:#f59e0b;--bad:#ef4444;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  padding:14px;display:flex;justify-content:center;
}
.app{width:100%;max-width:780px;display:grid;gap:14px}
.head{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
}
.head h1{margin:0;font-size:17px}
.head small{color:var(--mut);display:block;margin-top:2px}
.pill{
  background:#0d2b22;color:#6ee7b7;border:1px solid #1e5c48;
  border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;
}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{margin:0 0 10px;font-size:14px}
.pad{
  width:100%;height:190px;border-radius:12px;border:2px solid var(--line);
  background:#1d283a;color:#fff;font-size:17px;font-weight:800;
  display:grid;place-items:center;text-align:center;padding:16px;cursor:pointer;
  transition:background .12s,transform .06s;
}
.pad:active{transform:scale(.99)}
.pad.wait{background:#78350f;border-color:#d97706}
.pad.go{background:#065f46;border-color:#34d399}
.pad.early{background:#7f1d1d;border-color:#f87171}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.st{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.st b{display:block;font-size:16px;font-family:monospace}
.st small{font-size:11px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-family:monospace;font-size:12px}
.tm-num{font-family:monospace;font-size:34px;font-weight:800;text-align:center;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
button.btn,input,textarea{font:inherit}
button.btn{
  flex:1;background:var(--card2);color:var(--txt);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;font-weight:700;font-size:13px;cursor:pointer;
}
button.pri{background:var(--acc);color:#052e16;border-color:var(--acc)}
textarea{
  width:100%;min-height:110px;resize:vertical;background:var(--card2);color:var(--txt);
  border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;
}
.foot{font-size:12px;color:var(--mut);margin-top:6px;display:flex;justify-content:space-between;align-items:center}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div>
      <h1>⚡ PULSE & REFLEX HUB</h1>
      <small>Dự án mới gọn nhẹ · Tự chạy 100% trên trình duyệt</small>
    </div>
    <span class="pill">● Hoạt động ổn định</span>
  </div>

  <div class="grid">
    <div class="card">
      <h2>🎯 Mini-Game Đo Phản Xạ</h2>
      <button type="button" class="pad" id="pad">Bấm vào đây để bắt đầu<br><span style="font-size:13px;font-weight:500;opacity:.85">Đợi ô đổi màu XANH LÁ rồi bấm nhanh nhất có thể</span></button>
      <div class="stats">
        <div class="st"><b id="lastMs">—</b><small>Lần gần nhất</small></div>
        <div class="st"><b id="bestMs">—</b><small>Kỷ lục tốt nhất</small></div>
        <div class="st"><b id="avgMs">—</b><small>Trung bình</small></div>
      </div>
      <div class="chips" id="history"></div>
    </div>

    <div style="display:grid;gap:14px;align-content:start">
      <div class="card">
        <h2>⏱️ Đồng Hồ Nghỉ / Tập Trung</h2>
        <div class="tm-num" id="tmDisp">05:00</div>
        <div class="row">
          <button type="button" class="btn pri" id="tmStart">Bắt đầu</button>
          <button type="button" class="btn" id="tmPause">Tạm dừng</button>
          <button type="button" class="btn" id="tmReset">Đặt lại</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button type="button" class="btn" data-m="3">3 phút</button>
          <button type="button" class="btn" data-m="5">5 phút</button>
          <button type="button" class="btn" data-m="15">15 phút</button>
        </div>
      </div>

      <div class="card">
        <h2>📝 Ghi Chú Nhanh</h2>
        <textarea id="note" placeholder="Ghi nhanh ý tưởng dự án, việc cần làm sau khi ăn..."></textarea>
        <div class="foot">
          <span id="saveTxt">Tự động lưu</span>
          <button type="button" class="btn" id="clrNote" style="flex:0;padding:5px 10px;font-size:12px">Xoá</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(()=>{
  const $ = id => document.getElementById(id);
  const KEY = "pulse_hub_v1";
  let state = "idle", waitTimer = null, startTime = 0, iv = null, sec = 300, running = false;

  const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
  let scores = Array.isArray(saved.scores) ? saved.scores : [];
  $("note").value = typeof saved.note === "string" ? saved.note : "";

  function persist(){
    localStorage.setItem(KEY, JSON.stringify({scores, note: $("note").value}));
  }
  function renderScores(){
    $("lastMs").textContent = scores.length ? scores[0] + " ms" : "—";
    $("bestMs").textContent = scores.length ? Math.min(...scores) + " ms" : "—";
    const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
    $("avgMs").textContent = avg !== null ? avg + " ms" : "—";
    $("history").innerHTML = scores.slice(0, 8).map((v,i)=>`<span class="chip">#${i+1}: ${v}ms</span>`).join("");
  }

  $("pad").onclick = ()=>{
    if(state === "idle" || state === "early" || state === "done"){
      clearTimeout(waitTimer);
      state = "waiting";
      $("pad").className = "pad wait";
      $("pad").innerHTML = "Đợi màu XANH LÁ...<br><span style='font-size:13px;font-weight:500'>Chưa bấm vội nhé!</span>";
      const delay = 1100 + Math.floor(Math.random() * 2400);
      waitTimer = setTimeout(()=>{
        state = "go";
        startTime = performance.now();
        $("pad").className = "pad go";
        $("pad").innerHTML = "BẤM NGAY!<br><span style='font-size:13px;font-weight:500'>Chạm liền tay!</span>";
      }, delay);
    } else if(state === "waiting"){
      clearTimeout(waitTimer);
      state = "early";
      $("pad").className = "pad early";
      $("pad").innerHTML = "Bấm sớm quá rồi!<br><span style='font-size:13px;font-weight:500'>Bấm vào đây để thử lại</span>";
    } else if(state === "go"){
      const ms = Math.max(1, Math.round(performance.now() - startTime));
      scores.unshift(ms);
      scores = scores.slice(0, 20);
      persist();
      renderScores();
      state = "done";
      $("pad").className = "pad";
      $("pad").innerHTML = `${ms} ms!<br><span style='font-size:13px;font-weight:500'>Bấm để chơi lượt tiếp theo</span>`;
    }
  };

  function renderClock(){
    const s = Math.max(0, sec);
    $("tmDisp").textContent = `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  }
  function startClock(){
    if(running) return;
    running = true;
    iv = setInterval(()=>{
      if(sec > 0){ sec--; renderClock(); }
      else { clearInterval(iv); running = false; $("tmDisp").textContent = "HẾT GIỜ!"; }
    }, 1000);
  }
  $("tmStart").onclick = startClock;
  $("tmPause").onclick = ()=>{ running = false; clearInterval(iv); };
  $("tmReset").onclick = ()=>{ running = false; clearInterval(iv); sec = 300; renderClock(); };
  document.querySelectorAll("[data-m]").forEach(b=>{
    b.onclick = ()=>{ running = false; clearInterval(iv); sec = Number(b.dataset.m) * 60; renderClock(); };
  });

  $("note").oninput = ()=>{
    persist();
    $("saveTxt").textContent = "Đã lưu";
    setTimeout(()=> $("saveTxt").textContent = "Tự động lưu", 900);
  };
  $("clrNote").onclick = ()=>{ $("note").value = ""; persist(); };

  renderScores();
  renderClock();
})();
</script>
</body>
</html>
